<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(59,130,246,0.04)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Blue accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="url(#accent)"/>
  <!-- Logo mark -->
  <rect x="80" y="60" width="52" height="52" rx="4" fill="#2563eb"/>
  <text x="106" y="95" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">&#9889;</text>
  <!-- Company name -->
  <text x="148" y="98" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="white" letter-spacing="-1">DIOVAL<tspan fill="#3b82f6">.</tspan></text>
  <!-- Main headline -->
  <text x="80" y="240" font-family="Arial, sans-serif" font-size="56" font-weight="900" fill="white" letter-spacing="-2">AI Production Readiness</text>
  <text x="80" y="310" font-family="Arial, sans-serif" font-size="56" font-weight="900" fill="white" letter-spacing="-2">Audits &amp; Consulting</text>
  <!-- Subtitle -->
  <text x="80" y="370" font-family="Arial, sans-serif" font-size="22" fill="#94a3b8">Because 89% of AI agents fail in production.</text>
  <text x="80" y="400" font-family="Arial, sans-serif" font-size="22" fill="#94a3b8">We make sure yours don't.</text>
  <!-- Stats bar -->
  <rect x="80" y="460" width="1040" height="1" fill="rgba(255,255,255,0.06)"/>
  <text x="80" y="510" font-family="'Courier New', monospace" font-size="28" font-weight="bold" fill="white">139K+</text>
  <text x="80" y="535" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Words Published</text>
  <text x="300" y="510" font-family="'Courier New', monospace" font-size="28" font-weight="bold" fill="white">7</text>
  <text x="300" y="535" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Volumes</text>
  <text x="460" y="510" font-family="'Courier New', monospace" font-size="28" font-weight="bold" fill="white">8</text>
  <text x="460" y="535" font-family="Arial, sans-serif" font-size="13" fill="#64748b">PRS Dimensions</text>
  <text x="650" y="510" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">dioval.com</text>
  <!-- Bottom accent line -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#accent)"/>
</svg>
